name: SOUP - Generate Reports optionally including PDFs

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) for this workflow. JSON array or a single label. Defaults to the current value so existing callers are unaffected.'
        required: false
        type: string
        default: '["self-hosted", "Linux"]'
      generate-pdfs:
        description: 'Set to true to generate PDFs for approved SOUPs'
        type: boolean
jobs:
  reports:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: QuickBirdEng/actions/checkout-ssh@main
        with:
          ssh-private-key: ${{ secrets.CI_SSH_PRIVATE_KEY_FOR_GITHUB_PRIVATE_REPOS }}
      - uses: QuickBirdEng/actions/soups-generate-reports@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          generate-pdfs: ${{ inputs.generate-pdfs }}
